<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#132347"><link rel="manifest" href="./manifest.json"><title>GAURI RUN</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,#344f85,#101a35 65%);font-family:system-ui,sans-serif;color:#fff}.wrap{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}.logo{font-size:clamp(28px,6vw,44px);font-weight:1000;letter-spacing:3px}.logo span{color:#61e2d8}.tag{font-size:11px;letter-spacing:2px;color:#b9c9e8}.panel{background:#142344;border:1px solid #7188b955;border-radius:22px;padding:12px;box-shadow:0 20px 70px #0007}.hud{display:flex;justify-content:space-between;padding:2px 8px 10px;color:#b9c9e8;font-size:11px;letter-spacing:1px}.hud b{display:block;color:#fff;font-size:22px;letter-spacing:0}canvas{display:block;width:100%;height:auto;aspect-ratio:900/340;border-radius:14px;background:#d9f4f2;touch-action:pan-y}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 4px 2px}.hint{font-size:12px;color:#bdcbe4}button{border:0;border-radius:12px;padding:11px 15px;background:#2c426c;color:white;font-weight:800}button.primary{background:linear-gradient(120deg,#43d4c7,#489bdb);color:#08192e}.touch{display:none;gap:10px;margin-top:10px}.touch button{flex:1;padding:15px}@media(max-width:600px){.touch{display:flex}.tag{display:none}.panel{padding:8px}.hint{width:100%;text-align:center}}
</style></head><body><main class="wrap"><header><div><div class="logo">GAURI <span>RUN</span></div><div class="tag">A LITTLE RUN. A BIG ADVENTURE.</div></div><div class="tag">OFFLINE READY ✦</div></header><section class="panel"><div class="hud"><div>SCORE<b id="score">00000</b></div><div>BEST<b id="best">00000</b></div><div>COINS<b id="coins">0</b></div></div><canvas id="game" width="900" height="340"></canvas><div class="bar"><div class="hint">SPACE / ↑ / TAP TO JUMP · ↓ TO DUCK</div><div><button id="sound">♫ Sound: On</button> <button class="primary" id="restart">↻ Restart</button></div></div><div class="touch"><button id="jump">⬆ JUMP</button><button id="duck">⬇ DUCK</button></div></section></main><script src="./game.js"></script></body></html>
